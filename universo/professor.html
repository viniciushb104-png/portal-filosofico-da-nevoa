<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09050d"><meta name="description" content="Professor — Portal Filosófico da Névoa"><title>Professor</title><link rel="stylesheet" href="universo.css?v=1"><link rel="stylesheet" href="professor-oraculo.css?v=11"><link rel="stylesheet" href="professor-oraculo-magia.css?v=10"><link rel="stylesheet" href="professor-oraculo-rituais.css?v=1"><style id="oracle-entry-critical">
#oracleEntrance{position:fixed;z-index:2147483647;inset:0;display:grid!important;place-items:center!important;visibility:visible!important;opacity:1;background:radial-gradient(circle at 50% 38%,#341545 0,#130a1d 34%,#07040b 76%);padding:18px;color:#fff;font-family:Georgia,serif}
#oracleEntrance.leaving{opacity:0!important;pointer-events:none;transition:opacity .7s ease}
#oracleEntrance .oracle-entrance-panel{position:relative;z-index:2;width:min(520px,92vw);padding:32px 22px;text-align:center;border:1px solid rgba(234,193,255,.35);border-radius:26px;background:rgba(17,8,25,.92);box-shadow:0 28px 80px rgba(0,0,0,.55),0 0 55px rgba(159,75,206,.18)}
#oracleEntrance .oracle-entrance-orb{display:grid;place-items:center;width:92px;height:92px;margin:0 auto 15px;border-radius:50%;font-size:42px;background:radial-gradient(circle at 38% 30%,#e9d3ff,#984bc4 25%,#4d1f68 56%,#150a1f 78%);box-shadow:0 0 45px rgba(190,86,235,.42)}
#oracleEntrance small{display:block;color:#d99cf1;font:800 .58rem/1.3 system-ui,sans-serif;letter-spacing:.16em}
#oracleEntrance h1{margin:9px 0 8px;color:#f4d69a;font-size:clamp(2rem,8vw,3.1rem);line-height:1}
#oracleEntrance p{margin:0 auto 21px;max-width:390px;color:#d2c2da;font:400 .88rem/1.5 system-ui,sans-serif}
#oracleEntrance button{width:min(320px,100%);min-height:52px;border:1px solid #e1a8ff;border-radius:999px;background:linear-gradient(#a04bd0,#5b217e);color:white;font:900 .84rem/1 system-ui,sans-serif;cursor:pointer;box-shadow:0 0 30px rgba(183,75,226,.28)}
#oracleEntrance em{display:block;margin-top:11px;color:#8e7998;font:400 .56rem/1.3 system-ui,sans-serif;font-style:normal}
#oracleEntrance .oracle-entrance-stars{position:absolute;top:12%;left:50%;transform:translateX(-50%);color:#dcb8ec;opacity:.45}
#oracleEntrance .oracle-entrance-mist{position:absolute;width:72vw;height:18vh;border-radius:50%;filter:blur(42px);background:rgba(126,55,161,.22)}
#oracleEntrance .oracle-entrance-mist-a{left:-20vw;bottom:8vh}#oracleEntrance .oracle-entrance-mist-b{right:-20vw;top:8vh}
@media(max-width:600px){#oracleEntrance{padding:12px}#oracleEntrance .oracle-entrance-panel{padding:26px 16px 23px;border-radius:22px}#oracleEntrance .oracle-entrance-orb{width:76px;height:76px;font-size:34px}#oracleEntrance p{font-size:.78rem}}
</style></head><body data-page="professor"><div class="oracle-entrance" id="oracleEntrance" aria-label="Entrada da Central da Oráculo">
  <div class="oracle-entrance-mist oracle-entrance-mist-a"></div>
  <div class="oracle-entrance-mist oracle-entrance-mist-b"></div>
  <div class="oracle-entrance-stars" aria-hidden="true">✦　·　✧　·　✦　·　✧</div>
  <div class="oracle-entrance-panel">
    <div class="oracle-entrance-orb"><span>🔮</span></div>
    <small>PORTAL FILOSÓFICO DA NÉVOA</small>
    <h1>O Oráculo da Névoa</h1>
    <p>Entre na biblioteca encantada e prepare sua próxima aula.</p>
    <button type="button" id="oracleEnterButton">✦ Adentrar a Névoa</button>
    <em>com trilha instrumental original</em>
  </div>
</div>
<audio id="oracleThemeAudio" loop preload="metadata" playsinline aria-hidden="true" style="display:none">
  <source src="https://viniciushb104-png.github.io/portal-filosofico-da-nevoa/universo/assets/audio/oraculo/oraculo-da-nevoa-theme.mp3" type="audio/mpeg">
  <source src="https://raw.githubusercontent.com/viniciushb104-png/portal-filosofico-da-nevoa/main/universo/assets/audio/oraculo/oraculo-da-nevoa-theme.mp3" type="audio/mpeg">
</audio>
<main id="app"></main>
<script>
(function(){
  var gate=document.getElementById("oracleEntrance");
  var btn=document.getElementById("oracleEnterButton");
  var audio=document.getElementById("oracleThemeAudio");
  if(!gate||!btn)return;
  btn.addEventListener("click",function(){
    btn.disabled=true;
    btn.textContent="✦ Abrindo o portal...";
    gate.classList.add("portal-opening");
    if(audio){
      audio.muted=false;
      audio.volume=.10;
      try{audio.currentTime=0;}catch(e){}
      var p=audio.play();
      if(p&&typeof p.catch==="function"){p.catch(function(){})}
      var steps=0;
      var rise=window.setInterval(function(){
        steps++;
        try{audio.volume=Math.min(.52,.10+steps*.06)}catch(e){}
        if(steps>=7)window.clearInterval(rise);
      },85);
    }
    window.setTimeout(function(){gate.classList.add("leaving")},360);
    window.setTimeout(function(){
      if(gate&&gate.parentNode)gate.parentNode.removeChild(gate);
    },1120);
  },{once:true});
})();
</script><script src="professor-oraculo.js?v=12"></script><script src="professor-oraculo-magia.js?v=10"></script><script src="professor-oraculo-rituais.js?v=1"></script></body></html>
