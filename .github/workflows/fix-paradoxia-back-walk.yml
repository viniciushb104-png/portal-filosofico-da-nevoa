name: Fix Paradoxia back walk sprites
on:
  push:
    paths:
      - '.github/workflows/fix-paradoxia-back-walk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build clean back-walk strips
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          root=Path('jogos/paradoxia')
          src=root/'tatico/assets/characters'
          out=root/'assets/walk/back'
          out.mkdir(parents=True,exist_ok=True)

          classes=['dialetico','cetico','etico','existencial']

          def trim(im):
              im=im.convert('RGBA')
              box=im.getchannel('A').getbbox()
              return im.crop(box) if box else im

          for key in classes:
              sheet=Image.open(src/f'{key}_tactical_sheet.png').convert('RGBA')
              w,h=sheet.size
              back=trim(sheet.crop((w*3//4,0,w,h)))

              cell_w,cell_h=314,418
              margin_x,margin_y=18,12
              scale=min((cell_w-2*margin_x)/back.width,(cell_h-2*margin_y)/back.height)
              size=(max(1,int(back.width*scale)),max(1,int(back.height*scale)))
              base=back.resize(size,Image.Resampling.LANCZOS)

              atlas=Image.new('RGBA',(cell_w*4,cell_h),(0,0,0,0))
              offsets=[(0,0),(-2,-3),(0,1),(2,-3)]
              for i,(ox,oy) in enumerate(offsets):
                  frame=Image.new('RGBA',(cell_w,cell_h),(0,0,0,0))
                  x=(cell_w-base.width)//2+ox
                  y=cell_h-margin_y-base.height+oy
                  frame.alpha_composite(base,(x,y))
                  atlas.alpha_composite(frame,(i*cell_w,0))
              atlas.save(out/f'{key}_back_walk.png',optimize=True)

          PY
      - name: Validate
        run: |
          for c in dialetico cetico etico existencial; do
            test -s "jogos/paradoxia/assets/walk/back/${c}_back_walk.png"
          done
      - name: Commit
        run: |
          git config user.name "Paradoxia Sprite Fix"
          git config user.email "actions@users.noreply.github.com"
          git add jogos/paradoxia/assets/walk/back
          git commit -m "Corrige caminhada de costas em Paradoxia" || exit 0
          git push
