name: Import Paradoxia tactical art
on:
  push:
    paths:
      - '.github/workflows/import-paradoxia-art.yml'
permissions:
  contents: write
jobs:
  build-art:
    runs-on: ubuntu-latest
    env:
      DIA_B64: 
      CET_B64: 
      ETI_B64: 
      EXI_B64: 
      ENV_B64: 
      PROPS_B64: 
      BG_B64: 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Download original art
        shell: bash
        run: |
          mkdir -p /tmp/paradoxia-art
          echo "$DIA_B64" | base64 -d | xargs -I{} curl -L --fail --retry 3 "{}" -o /tmp/paradoxia-art/dialetico.png
          echo "$CET_B64" | base64 -d | xargs -I{} curl -L --fail --retry 3 "{}" -o /tmp/paradoxia-art/cetico.png
          echo "$ETI_B64" | base64 -d | xargs -I{} curl -L --fail --retry 3 "{}" -o /tmp/paradoxia-art/etico.png
          echo "$EXI_B64" | base64 -d | xargs -I{} curl -L --fail --retry 3 "{}" -o /tmp/paradoxia-art/existencial.png
          echo "$ENV_B64" | base64 -d | xargs -I{} curl -L --fail --retry 3 "{}" -o /tmp/paradoxia-art/environment.png
          echo "$PROPS_B64" | base64 -d | xargs -I{} curl -L --fail --retry 3 "{}" -o /tmp/paradoxia-art/props.png
          echo "$BG_B64" | base64 -d | xargs -I{} curl -L --fail --retry 3 "{}" -o /tmp/paradoxia-art/arena.png
      - name: Build optimized tactical assets
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json

          src=Path('/tmp/paradoxia-art')
          out=Path('jogos/paradoxia/tatico/assets')
          chars=out/'characters'; env=out/'environment'; bgs=out/'backgrounds'
          chars.mkdir(parents=True,exist_ok=True); env.mkdir(parents=True,exist_ok=True); bgs.mkdir(parents=True,exist_ok=True)

          def crop_alpha(im):
              im=im.convert('RGBA')
              bbox=im.getchannel('A').getbbox()
              return im.crop(bbox) if bbox else im

          def normalize_pose(im,cell=(512,512),margin=18):
              im=crop_alpha(im)
              scale=min((cell[0]-2*margin)/im.width,(cell[1]-2*margin)/im.height)
              nw,nh=max(1,int(im.width*scale)),max(1,int(im.height*scale))
              im=im.resize((nw,nh),Image.Resampling.LANCZOS)
              canvas=Image.new('RGBA',cell,(0,0,0,0))
              canvas.alpha_composite(im,((cell[0]-nw)//2,cell[1]-margin-nh))
              return canvas

          def make_sheet(path,layout,dst):
              im=Image.open(path).convert('RGBA'); W,H=im.size
              if layout=='2x2':
                  boxes=[(0,0,W//2,H//2),(W//2,0,W,H//2),(0,H//2,W//2,H),(W//2,H//2,W,H)]
              else:
                  q=W//4; boxes=[(i*q,0,(i+1)*q if i<3 else W,H) for i in range(4)]
              atlas=Image.new('RGBA',(2048,512),(0,0,0,0))
              for i,b in enumerate(boxes):
                  atlas.alpha_composite(normalize_pose(im.crop(b)),(i*512,0))
              atlas.save(dst,optimize=True)

          make_sheet(src/'dialetico.png','2x2',chars/'dialetico_tactical_sheet.png')
          make_sheet(src/'cetico.png','4x1',chars/'cetico_tactical_sheet.png')
          make_sheet(src/'etico.png','2x2',chars/'etico_tactical_sheet.png')
          make_sheet(src/'existencial.png','4x1',chars/'existencial_tactical_sheet.png')

          bg=Image.open(src/'arena.png').convert('RGB')
          bg.save(bgs/'circo_arena.jpg',quality=90,optimize=True,progressive=True)

          def crop_region(path,box):
              return crop_alpha(Image.open(path).convert('RGBA').crop(box))

          tile_boxes=[
              (0,335,320,555),
              (925,530,1254,790),
              (610,530,950,790),
              (0,745,320,1000),
              (300,745,645,1000)
          ]
          prop_boxes=[
              (0,0,615,240),
              (620,0,1254,240),
              (0,200,915,440),
              (590,390,1040,650),
              (570,630,900,890)
          ]
          def make_atlas(path,boxes,dst):
              atlas=Image.new('RGBA',(2560,512),(0,0,0,0))
              for i,b in enumerate(boxes):
                  im=crop_region(path,b)
                  scale=min(472/im.width,472/im.height)
                  nw,nh=int(im.width*scale),int(im.height*scale)
                  im=im.resize((nw,nh),Image.Resampling.LANCZOS)
                  atlas.alpha_composite(im,(i*512+(512-nw)//2,(512-nh)//2))
              atlas.save(dst,optimize=True)
          make_atlas(src/'environment.png',tile_boxes,env/'tiles_atlas.png')
          make_atlas(src/'props.png',prop_boxes,env/'props_atlas.png')

          manifest={
            "version":1,
            "pose_order":["front","action","side","back"],
            "sprite_cell":[512,512],
            "characters":{
              "dialetico":"characters/dialetico_tactical_sheet.png",
              "cetico":"characters/cetico_tactical_sheet.png",
              "etico":"characters/etico_tactical_sheet.png",
              "existencial":"characters/existencial_tactical_sheet.png"
            },
            "backgrounds":{"feira_falacias":"backgrounds/circo_arena.jpg"},
            "environment":{"tiles":"environment/tiles_atlas.png","props":"environment/props_atlas.png"}
          }
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Validate art
        run: |
          test -s jogos/paradoxia/tatico/assets/characters/dialetico_tactical_sheet.png
          test -s jogos/paradoxia/tatico/assets/characters/cetico_tactical_sheet.png
          test -s jogos/paradoxia/tatico/assets/characters/etico_tactical_sheet.png
          test -s jogos/paradoxia/tatico/assets/characters/existencial_tactical_sheet.png
          test -s jogos/paradoxia/tatico/assets/backgrounds/circo_arena.jpg
          test -s jogos/paradoxia/tatico/assets/environment/tiles_atlas.png
          test -s jogos/paradoxia/tatico/assets/environment/props_atlas.png
      - name: Commit tactical art
        run: |
          git config user.name "Paradoxia Art Bot"
          git config user.email "actions@users.noreply.github.com"
          git add jogos/paradoxia/tatico/assets
          git commit -m "Integra arte tática ilustrada de Paradoxia" || exit 0
          git push
