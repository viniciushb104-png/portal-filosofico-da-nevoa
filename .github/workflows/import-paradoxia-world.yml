name: Import Paradoxia illustrated world

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/import-paradoxia-world.yml"

permissions:
  contents: write

jobs:
  import-world:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download illustrated world
        env:
          WORLD_URL_B64: ""
        run: |
          set -euo pipefail
          mkdir -p jogos/paradoxia/assets/world
          URL="$(printf '%s' "$WORLD_URL_B64" | base64 -d)"
          curl -fL --retry 3 "$URL" -o jogos/paradoxia/assets/world/paradoxia_world_playable.webp

      - name: Validate world image
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("jogos/paradoxia/assets/world/paradoxia_world_playable.webp")
          data=p.read_bytes()
          assert data[:4] == b"RIFF" and data[8:12] == b"WEBP"
          assert len(data) > 400_000
          print(p, len(data))
          PY

      - name: Commit illustrated world
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos/paradoxia/assets/world/
          git commit -m "Adiciona mapa ilustrado jogável de Paradoxia"
          git push
