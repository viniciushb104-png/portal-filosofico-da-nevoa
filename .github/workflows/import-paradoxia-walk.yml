name: Import Paradoxia walking sprites

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/import-paradoxia-walk.yml"

permissions:
  contents: write

jobs:
  import-walk-sprites:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original walking sheets
        env:
          DIALETICO_B64: ""
          CETICO_B64: ""
          ETICO_B64: ""
          EXISTENCIAL_B64: ""
        run: |
          set -euo pipefail
          mkdir -p jogos/paradoxia/assets/walk
          echo "$DIALETICO_B64" | base64 -d | xargs curl -fL --retry 3 -o jogos/paradoxia/assets/walk/dialetico_walk.png
          echo "$CETICO_B64" | base64 -d | xargs curl -fL --retry 3 -o jogos/paradoxia/assets/walk/cetico_walk.png
          echo "$ETICO_B64" | base64 -d | xargs curl -fL --retry 3 -o jogos/paradoxia/assets/walk/etico_walk.png
          echo "$EXISTENCIAL_B64" | base64 -d | xargs curl -fL --retry 3 -o jogos/paradoxia/assets/walk/existencial_walk.png

      - name: Validate sheets
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path
          files=list(Path("jogos/paradoxia/assets/walk").glob("*_walk.png"))
          assert len(files)==4
          for p in files:
              data=p.read_bytes()
              assert data[:8]==b"\x89PNG\r\n\x1a\n"
              w,h=struct.unpack(">II",data[16:24])
              assert (w,h)==(1254,1254)
              assert len(data)>1_500_000
              print(p,w,h,len(data))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos/paradoxia/assets/walk/
          git commit -m "Adiciona sprites de caminhada de Paradoxia"
          git push
